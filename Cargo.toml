[workspace]
resolver = "2"
members = [
    "crates/al-core",
    "crates/al-job",
    "crates/al-cli",
    "crates/al-media",
    "crates/al-dataset",
    "crates/al-locate",
    "crates/al-analysis",
    "crates/al-service",
    "crates/al-gui",
    "crates/al-testkit",
    "crates/al-observability",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
# git 依存(private repo)を含むため crates.io 公開は不可。
# 公開方針確定前の暫定として ruviform と同じ publish = false に
# 揃える(docs/designs/ruviform-dependency-ci.md §8)。
publish = false

[workspace.dependencies]
al-core = { path = "crates/al-core" }
al-job = { path = "crates/al-job" }
al-media = { path = "crates/al-media" }
al-dataset = { path = "crates/al-dataset" }
al-locate = { path = "crates/al-locate" }
al-analysis = { path = "crates/al-analysis" }
al-service = { path = "crates/al-service" }
al-gui = { path = "crates/al-gui" }
al-testkit = { path = "crates/al-testkit" }
al-observability = { path = "crates/al-observability" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = [
    "fmt",
    "env-filter",
    "json",
    "ansi",
] }
tracing-appender = "0.2.5"

# Ruviform(private repo)の Git 依存。全 entry で同一の検証済み commit
# SHA(`rev`)を使うこと。更新時は一括で揃え、Cargo.lock の
# `git+...?rev=<sha>#<sha>` で再現性を確認する。
# 根拠: docs/designs/ruviform-dependency-ci.md §1-§2。
ruviform-media-core = { git = "https://github.com/scarecrow173/ruviform.git", rev = "9d267fdf7aa2b3f1cd250672f32b54813ada8e1d" }
ruviform-audio-core = { git = "https://github.com/scarecrow173/ruviform.git", rev = "9d267fdf7aa2b3f1cd250672f32b54813ada8e1d" }
ruviform-video-core = { git = "https://github.com/scarecrow173/ruviform.git", rev = "9d267fdf7aa2b3f1cd250672f32b54813ada8e1d" }
ruviform-media-io = { git = "https://github.com/scarecrow173/ruviform.git", rev = "9d267fdf7aa2b3f1cd250672f32b54813ada8e1d" }
ruviform-math = { git = "https://github.com/scarecrow173/ruviform.git", rev = "9d267fdf7aa2b3f1cd250672f32b54813ada8e1d" }
ruviform-dsp = { git = "https://github.com/scarecrow173/ruviform.git", rev = "9d267fdf7aa2b3f1cd250672f32b54813ada8e1d" }
ruviform-audio-analysis = { git = "https://github.com/scarecrow173/ruviform.git", rev = "9d267fdf7aa2b3f1cd250672f32b54813ada8e1d" }
ruviform-exec = { git = "https://github.com/scarecrow173/ruviform.git", rev = "9d267fdf7aa2b3f1cd250672f32b54813ada8e1d" }
ruviform-numeric = { git = "https://github.com/scarecrow173/ruviform.git", rev = "9d267fdf7aa2b3f1cd250672f32b54813ada8e1d" }
ruviform-io-avi = { git = "https://github.com/scarecrow173/ruviform.git", rev = "9d267fdf7aa2b3f1cd250672f32b54813ada8e1d" }
ruviform-io-symphonia = { git = "https://github.com/scarecrow173/ruviform.git", rev = "9d267fdf7aa2b3f1cd250672f32b54813ada8e1d", features = ["mp4", "aac"] }
ruviform-ui = { git = "https://github.com/scarecrow173/ruviform.git", rev = "9d267fdf7aa2b3f1cd250672f32b54813ada8e1d" }
ruviform-ui-webview = { git = "https://github.com/scarecrow173/ruviform.git", rev = "9d267fdf7aa2b3f1cd250672f32b54813ada8e1d" }
ruviform-viz = { git = "https://github.com/scarecrow173/ruviform.git", rev = "9d267fdf7aa2b3f1cd250672f32b54813ada8e1d" }

# Keep full debug info in release builds so external CPU samplers
# (samply — see docs/guides/profiling-samply.md) resolve symbols.
# Cost is artifact size only; codegen and optimization are unchanged.
[profile.release]
debug = true

# CI 用 profile(ruviform と同一 convention)。CI 成果物は
# `target/ci/` に分離され、dev の `target/debug/` を汚さない。
[profile.ci]
inherits = "dev"
debug = "line-tables-only"
incremental = false

# CI: dependencies outside the workspace do not need debug symbols.
[profile.ci.package."*"]
debug = "none"
