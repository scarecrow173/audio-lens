[workspace]
resolver = "2"
members = [
    "crates/al-core",
    "crates/al-math",
    "crates/al-job",
    "crates/al-cli",
    "crates/al-media",
    "crates/al-dataset",
    "crates/al-locate",
    "crates/al-analysis",
    "crates/al-viz",
    "crates/al-testkit",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
al-core = { path = "crates/al-core" }
al-math = { path = "crates/al-math" }
al-job = { path = "crates/al-job" }
al-media = { path = "crates/al-media" }
al-dataset = { path = "crates/al-dataset" }
al-locate = { path = "crates/al-locate" }
al-analysis = { path = "crates/al-analysis" }
al-viz = { path = "crates/al-viz" }
al-testkit = { path = "crates/al-testkit" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
