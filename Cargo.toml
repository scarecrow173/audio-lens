[workspace]
resolver = "2"
members = [
    "crates/al-core",
    "crates/al-job",
    "crates/al-cli",
    "crates/al-media",
    "crates/al-dataset",
    "crates/al-locate",
    "crates/al-analysis",
    "crates/al-service",
    "crates/al-gui",
    "crates/al-testkit",
    "crates/al-observability",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
# git 依存(private repo)を含むため crates.io 公開は不可。
# 公開方針確定前の暫定として ruviform と同じ publish = false に
# 揃える(docs/designs/ruviform-dependency-ci.md §8)。
publish = false

[workspace.dependencies]
al-core = { path = "crates/al-core" }
al-job = { path = "crates/al-job" }
al-media = { path = "crates/al-media" }
al-dataset = { path = "crates/al-dataset" }
al-locate = { path = "crates/al-locate" }
al-analysis = { path = "crates/al-analysis" }
al-service = { path = "crates/al-service" }
al-gui = { path = "crates/al-gui" }
al-testkit = { path = "crates/al-testkit" }
al-observability = { path = "crates/al-observability" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = [
    "fmt",
    "env-filter",
    "json",
    "ansi",
] }
tracing-appender = "0.2.5"

# Ruviform(private repo)の Git 依存。manifest には `rev`/`branch`/
# `tag` を書かない — 解決された commit SHA の正本は `Cargo.lock` の
# `source = "git+...#<sha>"` fragment。全 ruviform crate が同一 SHA に
# 解決されることは `node tools/ruviform-lock-rev.mjs`
# (`mise run check-ruviform-lock`)が fail-closed で検証する。
# 追従更新は `node tools/update-ruviform-rev.mjs <sha>` で lockfile を
# 明示更新する。
# 根拠: docs/designs/ruviform-dependency-ci.md §2、
# docs/designs/ruviform-lockfile-source-of-truth.md。
ruviform-media-core = { git = "https://github.com/scarecrow173/ruviform.git" }
ruviform-audio-core = { git = "https://github.com/scarecrow173/ruviform.git" }
ruviform-video-core = { git = "https://github.com/scarecrow173/ruviform.git" }
ruviform-media-io = { git = "https://github.com/scarecrow173/ruviform.git" }
ruviform-math = { git = "https://github.com/scarecrow173/ruviform.git" }
ruviform-dsp = { git = "https://github.com/scarecrow173/ruviform.git" }
ruviform-audio-analysis = { git = "https://github.com/scarecrow173/ruviform.git" }
ruviform-exec = { git = "https://github.com/scarecrow173/ruviform.git" }
ruviform-numeric = { git = "https://github.com/scarecrow173/ruviform.git" }
ruviform-io-avi = { git = "https://github.com/scarecrow173/ruviform.git" }
# IO-01 (Ruviform #283) の staged file publish 契約。al-job の
# fsutil 経由でのみ使い、generic staging/publish の正本とする
# (AL#143)。resolved SHA は IO-IMP-02 実 OS backend 以降を要求する。
ruviform-io-file = { git = "https://github.com/scarecrow173/ruviform.git" }
ruviform-io-symphonia = { git = "https://github.com/scarecrow173/ruviform.git", features = ["mp4", "aac"] }
# OBS-01 (Ruviform #276) の汎用 logging adapter。sink 構築・bounded
# writer・health の正本。AudioLens 固有の有効化ポリシー・file 命名
# 契約は al-observability が adapter として保持する(AL#138)。
ruviform-observability = { git = "https://github.com/scarecrow173/ruviform.git", features = ["logging"] }
ruviform-ui = { git = "https://github.com/scarecrow173/ruviform.git" }
ruviform-ui-webview = { git = "https://github.com/scarecrow173/ruviform.git" }
# Issue #166 AL-G2: DTCG 解釈の正本は ruviform-ui-theme (RF#385)。
# AudioLens は token 文書と mode 選択のみを所有する。
ruviform-ui-theme = { git = "https://github.com/scarecrow173/ruviform.git" }
# Issue #166 AL-G1: GPUI backend adapter (RF#386)。al-gui の `gpui`
# feature 経由でのみ有効化し、headless 既定解決を維持する。
ruviform-ui-gpui = { git = "https://github.com/scarecrow173/ruviform.git" }
# Issue #166 AL-G1: driver lifecycle の semantic fixture 正本
# (RF#390)。dev-dependency 専用。
ruviform-ui-test = { git = "https://github.com/scarecrow173/ruviform.git" }
ruviform-viz = { git = "https://github.com/scarecrow173/ruviform.git" }

# Keep full debug info in release builds so external CPU samplers
# (samply — see docs/guides/profiling-samply.md) resolve symbols.
# Cost is artifact size only; codegen and optimization are unchanged.
[profile.release]
debug = true

# CI 用 profile(ruviform と同一 convention)。CI 成果物は
# `target/ci/` に分離され、dev の `target/debug/` を汚さない。
[profile.ci]
inherits = "dev"
debug = "line-tables-only"
incremental = false

# CI: dependencies outside the workspace do not need debug symbols.
[profile.ci.package."*"]
debug = "none"
