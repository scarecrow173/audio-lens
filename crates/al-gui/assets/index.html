<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AudioLens</title>
<link rel="stylesheet" href="rvf://app/app.css" />
</head>
<body>
<header>
  <h1>AudioLens</h1>
  <span id="status">connecting…</span>
</header>
<div id="layout">
  <nav id="nav">
    <section>
      <h2>ジョブ</h2>
      <div class="row">
        <input id="baseDir" placeholder="base dir" />
        <button id="bSetBase">設定</button>
        <button id="bJobs">一覧</button>
      </div>
      <ul id="jobList" class="list"></ul>
    </section>
    <section>
      <h2>新規ジョブ</h2>
      <div id="newJobInputs"></div>
      <div class="row"><button id="bAddInput">入力追加</button></div>
      <div class="row"><button id="bRun">実行</button><button id="bCancel" disabled>キャンセル</button></div>
      <div id="jobProgress"><div id="jobBar"></div></div>
      <div id="jobStageList"></div>
    </section>
    <section>
      <h2>データセット</h2>
      <div class="row">
        <button id="bOpenJobDs">job の dataset を開く</button>
      </div>
      <ul id="dsTree" class="list"></ul>
    </section>
  </nav>
  <main id="main">
    <div id="tlControls" class="row" hidden>
      <select id="tlInput"></select>
      <select id="tlChannel"></select>
      <button id="bZoomOut">-</button>
      <button id="bZoomIn">+</button>
      <span id="tlRange"></span>
    </div>
    <canvas id="wave" height="160"></canvas>
    <canvas id="spec" height="220"></canvas>
    <canvas id="timeline" height="64"></canvas>
    <div id="detail"></div>
  </main>
</div>
<div id="log"></div>
<script src="rvf://app/app.js"></script>
</body>
</html>
