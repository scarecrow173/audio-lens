[package]
name = "al-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
al-core.workspace = true
al-job.workspace = true
al-dataset.workspace = true
al-locate.workspace = true
al-media.workspace = true
al-service.workspace = true
ruviform-ui.workspace = true
ruviform-ui-webview = { workspace = true, optional = true }
ruviform-ui-theme.workspace = true
ruviform-ui-gpui = { workspace = true, optional = true }
ruviform-viz.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

[dev-dependencies]
al-testkit.workspace = true
ruviform-ui-test.workspace = true

[features]
# 実窓 host を有効化。デフォルトは headless(lib + op 層のみ)。
webview = ["dep:ruviform-ui-webview", "ruviform-ui-webview/webview"]
# Issue #166 AL-G1: GPUI backend composition root (bin/al-desktop)。
# gpui crate 本体は ruviform-ui-gpui 内に閉じ込められる。
gpui = ["dep:ruviform-ui-gpui", "ruviform-ui-gpui/gpui"]
# GPUI Driver の consumer 観測 seam(`GpuiObserver`)を使う parity test 用。
gpui-test = ["gpui", "ruviform-ui-gpui/gpui-test"]

[[bin]]
name = "al-gui"
path = "src/bin/al-gui.rs"
required-features = ["webview"]

[[bin]]
name = "al-desktop"
path = "src/bin/al-desktop.rs"
required-features = ["gpui"]
