[package]
name = "al-analysis"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
al-core.workspace = true
al-job.workspace = true
al-media.workspace = true
al-dataset.workspace = true
al-locate.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
# Ruviform 解析/STFT・帯域カーネルの段階導入(AL#101 で消費。
# docs/designs/ruviform-dependency-ci.md §1)
ruviform-audio-analysis.workspace = true
ruviform-dsp.workspace = true
# 汎用 f64 数値カーネル(旧 al-math 相当、AL#101 で移行済)
ruviform-numeric.workspace = true

[dev-dependencies]
al-testkit.workspace = true
# criterion 0.8.2 — same pin as al-math (bench baseline for the
# caller-side optimization chain, docs/designs/caller-side-optimizations.md).
criterion = "=0.8.2"

[[bench]]
name = "stft"
harness = false

[[bench]]
name = "conv"
harness = false

[[bench]]
name = "band_correlation"
harness = false

[[bench]]
name = "csd_accum"
harness = false

[[bench]]
name = "quant_step"
harness = false

[[bench]]
name = "spectral_pass"
harness = false
