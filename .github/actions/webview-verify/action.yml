# webview-verify lane 本体(ci.yml の webview-verify/
# webview-verify-macos job が共有する composite action)。
# Issue #158 Full CI 化以降、ubuntu/windows legs と macOS leg は
# 全イベントで常時実行(結果は ci-summary が集約)。
# 呼び出し側 job が checkout を先に行う(local action 解決の前提)。
name: webview-verify lane
description: "al-gui `webview` feature lane (shared by ubuntu/windows legs and the macOS leg — full CI on every event)"

inputs:
  os:
    description: "runner label recorded in lane evidence (e.g. ubuntu-latest, macos-latest)"
    required: true
  access_mode:
    description: "ruviform-access job が解決した mode (deploy_key | anonymous | unavailable)"
    required: true
  deploy_key:
    description: "RUVIFORM_DEPLOY_KEY secret (deploy_key mode 時のみ使用)"
    required: false
    default: ""
  sccache_disable:
    description: "repo variable CI_SCCACHE_DISABLE (=1 で sccache step を全 skip)"
    required: false
    default: "0"

outputs:
  resolved_sha:
    description: "check-ruviform-rev が記録した ruviform resolved SHA"
    value: ${{ steps.guard.outputs.resolved_sha }}

runs:
  using: composite
  steps:
    - name: Gate on ruviform access mode
      if: inputs.access_mode == 'unavailable'
      shell: bash
      run: |
        echo "::error::ruviform dependency is unreachable — see docs/guides/ruviform-private-access-ci.md"
        exit 1

    - name: Set up mise
      uses: jdx/mise-action@v5.2.0
      with:
        install: false

    - name: Restore CI-scoped tools from mise.lock
      shell: bash
      run: |
        mise trust
        mise install --locked rust node

    # ubuntu のみ WebKitGTK dev headers が必要(ruviform ui-verify
    # と同一構成)。実窓起動は含まない。
    - name: Install WebKitGTK development headers (Linux)
      if: inputs.os == 'ubuntu-latest'
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

    - name: Restore cargo registry/git index cache
      uses: actions/cache@v6.1.0
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
        key: ${{ runner.os }}-cargo-ui-${{ hashFiles('Cargo.lock') }}
        restore-keys: ${{ runner.os }}-cargo-ui-

    # Issue #148 (AL-CI-OPT-01): verify lane と同一の sccache 構成。
    # `webview` feature + dev profile は verify(既定 feature・ci profile)
    # と compile fingerprint が異なり同一 OS namespace でも誤共有しない。
    # kill switch も同一(CI_SCCACHE_DISABLE=1 で全 step skip)。
    - name: Set up sccache
      if: inputs.sccache_disable != '1'
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      with:
        version: "v0.19.0"

    - name: Export sccache GHA backend env
      if: inputs.sccache_disable != '1'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        script: |
          const token = process.env.ACTIONS_RUNTIME_TOKEN || '';
          const url = process.env.ACTIONS_RESULTS_URL || '';
          const gha = token !== '' && url !== '';
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', token);
          core.exportVariable('ACTIONS_RESULTS_URL', url);
          core.exportVariable('SCCACHE_GHA_ENABLED', gha ? 'true' : 'false');
          core.exportVariable('SCCACHE_GHA_VERSION', `audiolens-v1-${process.env.RUNNER_OS || 'unknown'}`);
          core.exportVariable('RUSTC_WRAPPER', 'sccache');
          core.info(`sccache GHA backend: ${gha ? 'enabled' : 'disabled (cache credentials absent)'}`);

    - name: Verify sccache environment
      if: inputs.sccache_disable != '1'
      shell: bash
      run: |
        set -euo pipefail
        command -v sccache
        sccache --version
        echo "RUSTC_WRAPPER=$RUSTC_WRAPPER"
        echo "SCCACHE_GHA_ENABLED=$SCCACHE_GHA_ENABLED"
        echo "SCCACHE_GHA_VERSION=$SCCACHE_GHA_VERSION"
        if [ -n "${ACTIONS_RESULTS_URL:-}" ]; then echo "ACTIONS_RESULTS_URL: set"; else echo "::warning::ACTIONS_RESULTS_URL missing — sccache GHA backend disabled (local disk fallback)"; fi
        if [ -n "${ACTIONS_RUNTIME_TOKEN:-}" ]; then echo "ACTIONS_RUNTIME_TOKEN: set"; else echo "::warning::ACTIONS_RUNTIME_TOKEN missing — sccache GHA backend disabled (local disk fallback)"; fi

    - name: Configure read-only access to private ruviform dependency
      if: inputs.access_mode == 'deploy_key'
      id: ssh_cred
      shell: bash
      env:
        RUVIFORM_DEPLOY_KEY: ${{ inputs.deploy_key }}
      run: |
        set -euo pipefail
        key="${RUNNER_TEMP//\\//}/ruviform_deploy_key"
        printf '%s\n' "$RUVIFORM_DEPLOY_KEY" > "$key"
        chmod 600 "$key"
        known_hosts="${RUNNER_TEMP//\\//}/github_known_hosts"
        curl -fsSL https://api.github.com/meta \
          | jq -r '.ssh_keys[] | "github.com " + .' > "$known_hosts"
        test -s "$known_hosts"
        echo "GIT_SSH_COMMAND=ssh -i \"$key\" -o IdentitiesOnly=yes -o UserKnownHostsFile=\"$known_hosts\" -o StrictHostKeyChecking=yes" >> "$GITHUB_ENV"
        git config --global url."git@github.com:scarecrow173/ruviform.git".insteadOf "https://github.com/scarecrow173/ruviform.git"

    - name: Probe private ruviform access
      id: probe_key
      if: inputs.access_mode == 'deploy_key'
      shell: bash
      run: git ls-remote git@github.com:scarecrow173/ruviform.git HEAD

    - name: Probe anonymous ruviform access
      id: probe_anon
      if: inputs.access_mode == 'anonymous'
      shell: bash
      run: git ls-remote https://github.com/scarecrow173/ruviform.git HEAD

    - name: Fetch locked dependencies
      id: fetch
      shell: bash
      run: mise exec -- cargo fetch --locked

    - name: Verify ruviform resolved SHA (lockfile single-source)
      id: guard
      shell: bash
      run: mise run check-ruviform-rev

    - name: Type-check UI webview feature (mise run check-ui-webview)
      id: check
      shell: bash
      run: mise run check-ui-webview

    - name: Lint UI webview feature (mise run lint-ui-webview)
      id: lint
      shell: bash
      run: mise run lint-ui-webview

    - name: Test UI webview feature (mise run test-ui-webview)
      id: test
      shell: bash
      run: mise run test-ui-webview

    - name: sccache statistics
      if: inputs.sccache_disable != '1'
      shell: bash
      run: sccache --show-stats || true

    - name: Cleanup credential
      if: always() && inputs.access_mode == 'deploy_key'
      shell: bash
      run: |
        git config --global --unset-all url."git@github.com:scarecrow173/ruviform.git".insteadOf || true
        rm -f "${RUNNER_TEMP//\\//}/ruviform_deploy_key" "${RUNNER_TEMP//\\//}/github_known_hosts"

    - name: Record lane evidence
      if: always()
      shell: bash
      env:
        MODE: ${{ inputs.access_mode }}
      run: |
        set -uo pipefail
        os="${{ inputs.os }}"
        sha="${{ steps.guard.outputs.resolved_sha || 'unresolved' }}"
        probe="${{ steps.probe_anon.outcome }}"
        [ "${MODE:-}" = "deploy_key" ] && probe="${{ steps.probe_key.outcome }}"
        [ "${MODE:-}" = "unavailable" ] && probe="not run"
        {
          echo "## webview-verify — $os (access: ${MODE:-unknown})"
          echo ""
          echo "| lane | OS | feature | ruviform resolved SHA | 結果 |"
          echo "|---|---|---|---|---|"
          echo "| dep access (${MODE:-unknown}) + probe | $os | git deps | $sha | $probe |"
          echo "| cargo fetch --locked / check-ruviform-rev | $os | workspace | $sha | ${{ steps.fetch.outcome }} / ${{ steps.guard.outcome }} |"
          echo "| check-ui-webview | $os | al-gui webview | $sha | ${{ steps.check.outcome }} |"
          echo "| lint-ui-webview | $os | al-gui webview | $sha | ${{ steps.lint.outcome }} |"
          echo "| test-ui-webview | $os | al-gui webview | $sha | ${{ steps.test.outcome }} |"
        } >> "$GITHUB_STEP_SUMMARY"
