name: ci

# AudioLens 独立 CI(Issue #142)。Issue #158 で変更影響ベース選択実行
# (impact 分類・CI_IMPACT_SELECTIVE・Shadow Mode・期待集合照合)を
# 廃止し全 lane 毎回実行の Full CI に統一した。Issue #147/#158
# 最終段階で起動入口を workflow_dispatch のみに一元化した
# (Ruviform #365 横断決定)— PR 作成/更新・main push では本
# workflow は起動しない。検証は Daily Scheduler(daily-ci.yml が
# 判定 SHA を expected_sha として dispatch)または手動 dispatch で
# 実行する。
#
# 集約責務は最終 job `ci-summary` に統一: 必要な自動 job 全件を
# `always()` で待ち、success 以外(failure/cancelled/skipped/
# NotRun/unknown)を全て run 失敗にする fail-closed 判定。
# macOS legs の失敗/未完了も Full CI 全体の失敗/未完了となる。
#
# check 名 `summary` の job は旧 Required context `summary` の互換
# gate として維持する(Required 空の現在は redundant だが、撤去
# 条件は `ci-summary` の Required 化であり未達成 — issue-158
# design の延期項目)。失敗追跡は ci-issue-tracker.yml
# (workflow_run、ユーザー dispatch のみ観測)と
# ci-issue-tracker-reconcile.yml(schedule/manual、権威履歴
# reconcile)の 2 入口が担う。
#
# workflow_dispatch は inputs.expected_sha(必須・40 hex)を持ち、
# expected-sha job が全 run で checkout HEAD との一致を無条件照合
# する — Daily Scheduler が「判定した SHA」と dispatch を結ぶ
# 契約(判定 SHA ≠ 実測 SHA を証跡なしに通さない)。trigger を
# 誤って再導入しても expected_sha を持たない event run は照合で
# 即失敗する。
#
# Ruviform Git 依存のアクセス経路(ruviform-access job が解決):
# - deploy_key: secret RUVIFORM_DEPLOY_KEY 設定済み → read-only
#   Deploy Key + known_hosts 照合 + url.insteadOf 書換の SSH 経路。
#   private repo 復帰時の canonical 経路。
# - anonymous: secret 未設定かつ匿名 HTTPS で read 可能(public) →
#   秘密を一切使わない(最小権限 = 秘密を持たない)。
# - unavailable: 両方不可 → 下流 job の gate step が ::error:: で明示
#   失敗する。not-run を pass と偽らない(全 lane not-run や
#   cancelled は ci-summary job が run を失敗にする)。
#
# mise ツールは CI 実行に必要なものだけを --locked で scope する
# (開発ツールの apm/pipx:serena-agent は activate しない)。
#
# lane の step 本体は .github/actions/{verify,ui-verify,
# webview-verify} の composite action が単一定義を持ち、
# ubuntu/windows legs と macOS leg が共有する。
#
# 構造契約(trigger・job 集合・needs・ci-summary/summary 分離・
# 選択実行機構の不在)は tools/check-ci-workflow.mjs が検査する
# (prek hook 経由で hygiene job が全 run で実施する)。

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Dispatch 判定時の対象 commit SHA(40 hex)。checkout revision と不一致なら expected-sha job が run を失敗にする"
        required: true
        type: string

permissions:
  contents: read

# 同一 ref への重複 dispatch は非 main ref で cancel(最新のみ
# 検証)。main への dispatch は cancel しない(実行ごとの検証履歴を
# 保全する)。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  MISE_ENABLE_TOOLS: rust,git-lfs,node,prek,uv,biome,actionlint
  # Rust toolchain pin は mise.ci.toml(CI 専用)に分離 — MISE_ENV=ci で
  # 有効化し、通常開発は環境導入済みの rust を使う。
  MISE_ENV: ci
  CARGO_INCREMENTAL: "0"

jobs:
  # workflow_dispatch の判定 SHA 契約(Issue #158)。起動入口が
  # dispatch のみのため全 run で無条件照合する — checkout した
  # revision が inputs.expected_sha と一致しない run を即失敗に
  # する。全検証 job が needs するため、不一致 run は lane 全 skip
  # + ci-summary fail で閉じる(lane 実行コストを掛けず
  # fail-closed)。
  expected-sha:
    name: expected-sha
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (dispatch SHA guard)
        uses: actions/checkout@v7.0.1

      - name: Verify checked-out revision matches expected_sha
        shell: bash
        env:
          EXPECTED: ${{ github.event.inputs.expected_sha }}
        run: |
          set -euo pipefail
          if ! [[ "$EXPECTED" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::expected_sha input must be a 40-hex commit SHA (got: '$EXPECTED')"
            exit 1
          fi
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$EXPECTED" ]; then
            echo "::error::expected_sha mismatch — 判定 SHA=$EXPECTED だが checkout HEAD=$actual(判定後に ref が更新された可能性)"
            exit 1
          fi
          {
            echo "## expected_sha contract — OK"
            echo ""
            echo "- expected_sha (dispatch input): \`$EXPECTED\`"
            echo "- checkout HEAD: \`$actual\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # secret は job `if:` で参照できないため、preflight job で access
  # mode を解決して output 経由で下流へ渡す(consumer-verify と同型)。
  ruviform-access:
    name: ruviform-access
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.probe.outputs.mode }}
    steps:
      - name: Resolve ruviform dependency access mode
        id: probe
        env:
          KEY: ${{ secrets.RUVIFORM_DEPLOY_KEY }}
        run: |
          set -uo pipefail
          if [ -n "${KEY:-}" ]; then
            echo "mode=deploy_key" >> "$GITHUB_OUTPUT"
            echo "ruviform access: deploy_key (RUVIFORM_DEPLOY_KEY configured)"
          elif git ls-remote https://github.com/scarecrow173/ruviform.git HEAD >/dev/null 2>&1; then
            echo "mode=anonymous" >> "$GITHUB_OUTPUT"
            echo "ruviform access: anonymous HTTPS (repo is public)"
          else
            echo "mode=unavailable" >> "$GITHUB_OUTPUT"
            echo "::warning::no access path to scarecrow173/ruviform — anonymous HTTPS unreachable and RUVIFORM_DEPLOY_KEY unset"
          fi

  # Repo hygiene lane: `prek run --all-files`。paths filter を置かず
  # doc 変更を含む全ファイルを hygiene 検査する不変条件を維持する
  # (audiolens-independent-ci §1)。actionlint に加え
  # check-ci-workflow hook が ci.yml の構造契約を検査する。
  hygiene:
    name: hygiene
    needs: [expected-sha]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up mise
        uses: jdx/mise-action@v5.2.0
        with:
          install: false

      - name: Restore CI-scoped tools from mise.lock
        run: |
          mise trust
          mise install --locked rust prek uv biome actionlint node

      - name: Check config files with prek
        run: mise exec -- prek run --all-files

  # Rust 本体 + Golden/LFS/Export + CLI headless lane。step 本体は
  # .github/actions/verify (composite)が ubuntu/windows legs と
  # verify-macos の macOS leg で共有する単一定義。
  # expected-sha(判定 SHA 不一致)・ruviform-access(依存解決不能)
  # 失敗時は skip(ci-summary が fail-closed で拾う)。
  verify:
    name: verify (${{ matrix.os }})
    needs: [ruviform-access, expected-sha]
    if: ${{ !cancelled() && needs.ruviform-access.result == 'success' && needs.expected-sha.result == 'success' }}
    runs-on: ${{ matrix.os }}
    strategy:
      # 片 OS の失敗で他 OS の結果を消さない。
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    outputs:
      resolved_sha: ${{ steps.lane.outputs.resolved_sha }}
    steps:
      # `lfs: true` で実メディア fixture(Golden/Export 回帰が使用)を
      # 復元する。
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          lfs: true

      - name: verify lane
        id: lane
        uses: ./.github/actions/verify
        with:
          os: ${{ matrix.os }}
          access_mode: ${{ needs.ruviform-access.outputs.mode }}
          deploy_key: ${{ secrets.RUVIFORM_DEPLOY_KEY }}
          sccache_disable: ${{ vars.CI_SCCACHE_DISABLE }}

  # verify の macOS leg(verify と同一 step 本体を macos-latest で
  # 実行)。Required `summary` の needs には含めない — macOS runner
  # 逼迫時も Required gate は本 job を待たない(#157 の性質維持)。
  # Full CI verdict の `ci-summary` は needs に含め、macOS の失敗/
  # 未完了を Full CI 全体の失敗/未完了とする。
  verify-macos:
    name: verify (macos-latest)
    needs: [ruviform-access, expected-sha]
    if: ${{ !cancelled() && needs.ruviform-access.result == 'success' && needs.expected-sha.result == 'success' }}
    runs-on: macos-latest
    outputs:
      resolved_sha: ${{ steps.lane.outputs.resolved_sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          lfs: true

      - name: verify lane
        id: lane
        uses: ./.github/actions/verify
        with:
          os: macos-latest
          access_mode: ${{ needs.ruviform-access.outputs.mode }}
          deploy_key: ${{ secrets.RUVIFORM_DEPLOY_KEY }}
          sccache_disable: ${{ vars.CI_SCCACHE_DISABLE }}

  # ui/ の headless TS lane。vendor tree は gitignore 済み生成物
  # のため、sync-ui-deps が Cargo pin と同一 SHA で materialize
  # する(Ruviform #310/#311/#314 の利用可能部品が増えた場合の
  # UI integration smoke の受け皿でもある)。
  ui-verify:
    name: ui-verify (${{ matrix.os }})
    needs: [ruviform-access, expected-sha]
    if: ${{ !cancelled() && needs.ruviform-access.result == 'success' && needs.expected-sha.result == 'success' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    outputs:
      resolved_sha: ${{ steps.lane.outputs.resolved_sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: ui-verify lane
        id: lane
        uses: ./.github/actions/ui-verify
        with:
          os: ${{ matrix.os }}
          access_mode: ${{ needs.ruviform-access.outputs.mode }}
          deploy_key: ${{ secrets.RUVIFORM_DEPLOY_KEY }}

  # ui-verify の macOS leg(verify-macos と同構造 — Required
  # `summary` の needs に含めず、`ci-summary` が集約する)。
  ui-verify-macos:
    name: ui-verify (macos-latest)
    needs: [ruviform-access, expected-sha]
    if: ${{ !cancelled() && needs.ruviform-access.result == 'success' && needs.expected-sha.result == 'success' }}
    runs-on: macos-latest
    outputs:
      resolved_sha: ${{ steps.lane.outputs.resolved_sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: ui-verify lane
        id: lane
        uses: ./.github/actions/ui-verify
        with:
          os: macos-latest
          access_mode: ${{ needs.ruviform-access.outputs.mode }}
          deploy_key: ${{ secrets.RUVIFORM_DEPLOY_KEY }}

  # al-gui `webview` feature lane(実窓 host 依存ターゲットの分離
  # 検証。実 Window/OS 自動試験は含まない — gui-real が not-run を
  # 記録する)。ubuntu は WebKitGTK dev headers が必要(ruviform
  # ui-verify と同一構成)。
  webview-verify:
    name: webview-verify (${{ matrix.os }})
    needs: [ruviform-access, expected-sha]
    if: ${{ !cancelled() && needs.ruviform-access.result == 'success' && needs.expected-sha.result == 'success' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    outputs:
      resolved_sha: ${{ steps.lane.outputs.resolved_sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: webview-verify lane
        id: lane
        uses: ./.github/actions/webview-verify
        with:
          os: ${{ matrix.os }}
          access_mode: ${{ needs.ruviform-access.outputs.mode }}
          deploy_key: ${{ secrets.RUVIFORM_DEPLOY_KEY }}
          sccache_disable: ${{ vars.CI_SCCACHE_DISABLE }}

  # webview-verify の macOS leg(verify-macos と同構造 — Required
  # `summary` の needs に含めず、`ci-summary` が集約する)。
  webview-verify-macos:
    name: webview-verify (macos-latest)
    needs: [ruviform-access, expected-sha]
    if: ${{ !cancelled() && needs.ruviform-access.result == 'success' && needs.expected-sha.result == 'success' }}
    runs-on: macos-latest
    outputs:
      resolved_sha: ${{ steps.lane.outputs.resolved_sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: webview-verify lane
        id: lane
        uses: ./.github/actions/webview-verify
        with:
          os: macos-latest
          access_mode: ${{ needs.ruviform-access.outputs.mode }}
          deploy_key: ${{ secrets.RUVIFORM_DEPLOY_KEY }}
          sccache_disable: ${{ vars.CI_SCCACHE_DISABLE }}

  # 実 Window/OS 自動試験の placeholder。Ruviform #312(test host)/
  # #313(OS driver)が未接続のため、本 run では検証範囲外であること
  # を not-run の証拠として常時記録する(headless/ui-verify を実
  # GUI 検証の代用としない)。接続時は opt-in lane へ置き換える。
  gui-real:
    name: gui-real
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.result.outputs.status }}
    steps:
      - name: Record real-GUI gate as not run
        id: result
        run: |
          set -uo pipefail
          {
            echo "## gui-real — 実 GUI 回帰 gate: not run"
            echo ""
            echo "| lane | OS | feature | ruviform resolved SHA | 結果 | 備考 |"
            echo "|---|---|---|---|---|---|"
            echo "| gui-real | - | 実 Window/OS 自動試験 | - | not run | Ruviform #312/#313 未接続。opt-in/専用 Runner で別 Gate |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "status=not_run" >> "$GITHUB_OUTPUT"

  # Full CI verdict(Issue #158 / Ruviform #365 共通契約)。必要な
  # 自動 job 全件を `always()` で待ち、success 以外(failure/
  # cancelled/skipped/NotRun/unknown)を全て run 失敗にする
  # fail-closed 集約。旧 `summary`(期待集合照合)と旧
  # `macos-summary`(macOS lane 記録)の集約責務を統一したもの —
  # macOS legs の失敗/未完了も Full CI 全体の失敗/未完了となる
  # (leg 滞留中は本 check が Pending のまま残り、未実行を成功に
  # 変換しない)。
  ci-summary:
    name: ci-summary
    needs: [expected-sha, ruviform-access, hygiene, verify, verify-macos, ui-verify, ui-verify-macos, webview-verify, webview-verify-macos, gui-real]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # dispatch input は always() 実行下でも未検証のまま到達し得る
      # (expected-sha job が拒否しても本 job は走る)ため、run 本文へ
      # 式展開せず env 経由で値としてのみ扱う。
      - name: Aggregate lane evidence
        shell: bash
        env:
          EXPECTED_SHA_INPUT: ${{ github.event.inputs.expected_sha }}
        run: |
          set -uo pipefail
          {
            echo "# Full CI evidence — ${{ github.ref_name }} @ ${{ github.sha }}"
            echo ""
            echo "- event: ${{ github.event_name }}"
            echo "- expected_sha (dispatch input): ${EXPECTED_SHA_INPUT:-n/a (non-dispatch event)}"
            echo "- access mode: ${{ needs.ruviform-access.outputs.mode || 'unknown' }}"
            echo "- ruviform resolved SHA: ${{ needs.verify.outputs.resolved_sha || needs.verify-macos.outputs.resolved_sha || needs.ui-verify.outputs.resolved_sha || needs.ui-verify-macos.outputs.resolved_sha || needs.webview-verify.outputs.resolved_sha || needs.webview-verify-macos.outputs.resolved_sha || 'unresolved' }}"
            echo "- run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- 実 GUI/Window 自動試験: not run(Ruviform #312/#313 未接続。実機未検証)"
            echo ""
            echo "| lane | OS | 結果 |"
            echo "|---|---|---|"
            echo "| expected-sha | ubuntu-latest | ${{ needs.expected-sha.result }} |"
            echo "| ruviform-access | ubuntu-latest | ${{ needs.ruviform-access.result }} |"
            echo "| hygiene | ubuntu-latest | ${{ needs.hygiene.result }} |"
            echo "| verify | ubuntu-latest / windows-latest | ${{ needs.verify.result }} |"
            echo "| verify | macos-latest | ${{ needs.verify-macos.result }} |"
            echo "| ui-verify | ubuntu-latest / windows-latest | ${{ needs.ui-verify.result }} |"
            echo "| ui-verify | macos-latest | ${{ needs.ui-verify-macos.result }} |"
            echo "| webview-verify | ubuntu-latest / windows-latest | ${{ needs.webview-verify.result }} |"
            echo "| webview-verify | macos-latest | ${{ needs.webview-verify-macos.result }} |"
            echo "| gui-real | ubuntu-latest | ${{ needs.gui-real.result }} (status=${{ needs.gui-real.outputs.status || 'not_run' }}) |"
            echo ""
            echo "検証範囲: Golden/LFS/Export/全回帰=test-ci(verify), CLI headless=verify(al-cli build + check-cli-headless), UI=ui-verify(vendor 整合+tsc+happy-dom), WebView=webview-verify(al-gui webview feature), 実 GUI=gui-real(not_run placeholder)"
          } >> "$GITHUB_STEP_SUMMARY"

      # 失敗時の Owner 切り分け指針(レポート形式の固定部)。
      - name: Owner triage guidance
        if: needs.expected-sha.result != 'success' || needs.ruviform-access.result != 'success' || needs.hygiene.result != 'success' || needs.verify.result != 'success' || needs.verify-macos.result != 'success' || needs.ui-verify.result != 'success' || needs.ui-verify-macos.result != 'success' || needs.webview-verify.result != 'success' || needs.webview-verify-macos.result != 'success'
        shell: bash
        run: |
          {
            echo "## Owner 切り分け"
            echo ""
            echo "- expected-sha 失敗 → dispatch の判定 SHA と checkout revision の不一致(ref が判定後に更新された)。最新 SHA で dispatch し直す。設計: docs/designs/full-ci-ci-summary-issue-158.md"
            echo "- Rust check/lint/test/Golden/Export 失敗 → まず Consumer(AudioLens)側の回帰として切り分ける。Ruviform pin 更新直後のみの失敗は Ruviform 側の可能性として cross-consumer 再実測を [ruviform #294](https://github.com/scarecrow173/ruviform/issues/294) へ報告"
            echo "- al-cli Export 系の失敗 → 既知 Issue [#141](https://github.com/scarecrow173/audio-lens/issues/141) を参照(本 CI は修正を担わない)"
            echo "- dep access/fetch 失敗 → repo visibility / Deploy Key 登録を [guide](https://github.com/scarecrow173/audio-lens/blob/main/docs/guides/ruviform-private-access-ci.md) に従い確認"
            echo "- ui-verify で REV 不一致 → sync-ui-deps 未実行または pin ずれ(Consumer 側)"
            echo "- macOS leg の失敗/滞留 → Full CI 全体の失敗/未完了。macOS 対応のリリース受入条件は docs/guides/release-macos-verification.md を参照"
          } >> "$GITHUB_STEP_SUMMARY"

      # fail-closed 判定: needs 全 job の result が success のときのみ
      # run を成功にする。skipped(上流失敗/未実行)・cancelled・
      # unknown も Pass にしない。
      - name: Enforce fail-closed gate
        shell: bash
        run: |
          set -uo pipefail
          fail=0
          for pair in \
            "expected-sha:${{ needs.expected-sha.result }}" \
            "ruviform-access:${{ needs.ruviform-access.result }}" \
            "hygiene:${{ needs.hygiene.result }}" \
            "verify:${{ needs.verify.result }}" \
            "verify-macos:${{ needs.verify-macos.result }}" \
            "ui-verify:${{ needs.ui-verify.result }}" \
            "ui-verify-macos:${{ needs.ui-verify-macos.result }}" \
            "webview-verify:${{ needs.webview-verify.result }}" \
            "webview-verify-macos:${{ needs.webview-verify-macos.result }}" \
            "gui-real:${{ needs.gui-real.result }}"; do
            lane="${pair%%:*}"; res="${pair##*:}"
            if [ "$res" != "success" ]; then
              echo "::error::job $lane result=$res — Full CI は全必要 job の success のみを Pass とする(failure/cancelled/skipped/NotRun/unknown は不可)"
              fail=1
            fi
          done
          if [ "$fail" = "1" ]; then
            exit 1
          fi
          echo "ci-summary: 全必要 job success — Full CI pass (gui-real は not_run 証跡として記録済み)"

  # Required context `summary` 互換 gate。`main-checkstatus`
  # Ruleset が Required とする check 名 `summary` を継続発行する。
  # 判定範囲は #157 と同じ macOS 非含有 scope — macOS legs は
  # needs に含めず、macOS runner 逼迫で Required gate が滞留
  # しない(Full CI verdict は `ci-summary` が担う)。Full CI 化で
  # 期待集合照合は撤去し、needs 全 job の success のみを要求する
  # 単純 fail-closed。`ci-summary` が Required 化された後に本 job
  # は撤去する(最終段階)。
  summary:
    name: summary
    needs: [expected-sha, ruviform-access, hygiene, verify, ui-verify, webview-verify, gui-real]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate required-gate evidence
        shell: bash
        run: |
          set -uo pipefail
          {
            echo "# Required gate evidence — ${{ github.ref_name }} @ ${{ github.sha }}"
            echo ""
            echo "- 本 check は Ruleset Required context \`summary\` — 判定範囲は macOS 非含有 scope(#157 維持)"
            echo "- Full CI verdict(macOS 込み fail-closed)は \`ci-summary\` check / run を参照"
            echo "- access mode: ${{ needs.ruviform-access.outputs.mode || 'unknown' }}"
            echo "- ruviform resolved SHA: ${{ needs.verify.outputs.resolved_sha || needs.ui-verify.outputs.resolved_sha || needs.webview-verify.outputs.resolved_sha || 'unresolved' }}"
            echo "- run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""
            echo "| lane | OS | 結果 |"
            echo "|---|---|---|"
            echo "| expected-sha | ubuntu-latest | ${{ needs.expected-sha.result }} |"
            echo "| ruviform-access | ubuntu-latest | ${{ needs.ruviform-access.result }} |"
            echo "| hygiene | ubuntu-latest | ${{ needs.hygiene.result }} |"
            echo "| verify | ubuntu-latest / windows-latest | ${{ needs.verify.result }} |"
            echo "| ui-verify | ubuntu-latest / windows-latest | ${{ needs.ui-verify.result }} |"
            echo "| webview-verify | ubuntu-latest / windows-latest | ${{ needs.webview-verify.result }} |"
            echo "| gui-real | ubuntu-latest | ${{ needs.gui-real.result }} (status=${{ needs.gui-real.outputs.status || 'not_run' }}) |"
            echo "| verify / ui-verify / webview-verify | macos-latest | 判定対象外 | \`ci-summary\` が集約(Full CI verdict) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce required-gate
        shell: bash
        run: |
          set -uo pipefail
          fail=0
          for pair in \
            "expected-sha:${{ needs.expected-sha.result }}" \
            "ruviform-access:${{ needs.ruviform-access.result }}" \
            "hygiene:${{ needs.hygiene.result }}" \
            "verify:${{ needs.verify.result }}" \
            "ui-verify:${{ needs.ui-verify.result }}" \
            "webview-verify:${{ needs.webview-verify.result }}" \
            "gui-real:${{ needs.gui-real.result }}"; do
            lane="${pair%%:*}"; res="${pair##*:}"
            if [ "$res" != "success" ]; then
              echo "::error::job $lane result=$res — Required gate は全必要 job の success のみを Pass とする"
              fail=1
            fi
          done
          if [ "$fail" = "1" ]; then
            exit 1
          fi
          echo "summary: required-gate scope の全 job success — pass(macOS legs は ci-summary が判定)"
