[settings]
minimum_release_age = "7d"
# mise.lock と整合する固定バージョンを通常の install/use でも利用する
lockfile = true

[env]
UV_EXCLUDE_NEWER = "1 week"

# 実装言語は Rust(docs/adr/implementation-stack.md)。
# apm install / serena MCP 用の最小構成に加えて rust を pin する。
[tools]
# rustup default profile は環境依存なので fmt/clippy の component を明示する
# (fresh CI runner で `cargo fmt`/`cargo clippy` が component 欠落しないように)。
# バージョンは ruviform のピンに揃える。
rust = { version = "1.99.0", components = "rustfmt,clippy" }
# python は toolchain に含めない — pipx: バックエンドは uv 経由で uv 管理の
# cpython に venv を作るため、mise python を参照しない。直接 python を呼ぶ
# 用途ができた場合のみ追加する。
# GHSA-hq85-5cpj-mr62 (eMudhra/emSign 中間CA) の修正を含む 0.13.5 を
# exact pin する(ruviform と同一バージョン)。
# minimum_release_age = "7d" は exact version には適用されないため、
# セキュリティ修正を age gate が妨げない。
uv = "0.13.5"
# tools/cinematic-sword-cutscene (Remotion) と .agents/skills 配下の JS
# スクリプトが使う Node.js。2026-10-21 セキュリティリリースの修正版
# 26.12.1 を exact pin する(ruviform と同一バージョン。uv のコメント参照)。
# Remotion 4.x の要件 (Node.js 18+) も満たす。
node = "26.12.1"
# apm.lock.yaml は apm 0.33.0 で生成。lock 生成版に pin する。
# github バイナリバックエンドを使う(pipx 版は .mise/locks/ に dep-graph
# sidecar を要し、Python も不要になる)。
"github:microsoft/apm" = "0.33.0"
"pipx:serena-agent" = "1.7.0"
# pre-commit 互換 runner(aqua:j178/prek)。hook 定義は .pre-commit-config.yaml
# eMudhra CA 修正版 0.5.7(GHSA-hq85-5cpj-mr62 対応)。
prek = "0.5.7"
# aqua:biomejs/biome(npm 非経由)。biome.json の schema version に揃える。
# eMudhra CA 修正版 2.6.2(GHSA-hq85-5cpj-mr62 対応)。
biome = "2.6.2"
# aqua:git-lfs/git-lfs。LFS objects の materialize は setup task が担う
git-lfs = "3.8.0"
# GitHub Actions workflow の静的検証(prek hook と CI で使用。
# ruviform と同一バージョン)
actionlint = "1.7.12"

# Repository-owned setup contract: fresh checkout を開発可能にする
# canonical entrypoint。toolchain は mise.toml + mise.lock で復元される。
[tasks.setup]
description = "Restore APM dependencies, git hooks and LFS objects for a fresh checkout"
run = [
  "apm install",
  "prek install",
  # `git lfs` は Git for Windows 同梱版が優先されるため binary 直呼びにする
  "git-lfs install --local",
  "git-lfs pull",
]

[tasks.build]
description = "cargo build --workspace"
run = "cargo build --workspace"

[tasks.test]
description = "cargo test --workspace"
run = "cargo test --workspace"

[tasks.lint]
description = "biome check + cargo clippy --workspace -- -D warnings"
run = [
  "biome check",
  "cargo clippy --workspace --all-targets -- -D warnings",
]

[tasks.fmt]
description = "cargo fmt --all -- --check"
run = "cargo fmt --all -- --check"

[tasks.check]
description = "cargo check --workspace --all-targets(dev profile)"
run = "cargo check --workspace --all-targets"

# CI-only tasks: 同一の検査を `--profile ci` + CARGO_INCREMENTAL=0 で
# 実行する。成果物は dev の target/debug/ と分離され target/ci/ に
# 出る(ruviform と同一 convention。ローカル常用はしない)。
[tasks.check-ci]
description = "CI profile type-check: cargo check --workspace --all-targets --profile ci"
run = "cargo check --workspace --all-targets --profile ci"
env = { CARGO_INCREMENTAL = "0" }

[tasks.lint-ci]
description = "CI profile lint: biome check + cargo clippy --workspace --all-targets --profile ci -- -D warnings"
run = [
  "biome check",
  "cargo clippy --workspace --all-targets --profile ci -- -D warnings",
]
env = { CARGO_INCREMENTAL = "0" }

[tasks.test-ci]
description = "CI profile tests: cargo test --workspace --profile ci"
run = "cargo test --workspace --profile ci"
env = { CARGO_INCREMENTAL = "0" }

[tasks.build-ci]
description = "CI profile build: cargo build --workspace --profile ci"
run = "cargo build --workspace --profile ci"
env = { CARGO_INCREMENTAL = "0" }

[tasks.verify-toolchain]
description = "rustc/cargo/rustfmt/clippy が mise pin に解決されることを検証(node、3 OS 共通)"
run = "node tools/verify-toolchain.mjs"

[tasks.check-cli-headless]
description = "al-cli 等 headless crate の依存木に GUI/GPU/WebView framework crate が無いことを検証(node、3 OS 共通)"
run = "node tools/check-headless-deps.mjs"

# Issue #140: Ruviform resolved revision の正本は Cargo.lock。
# manifest には rev を書かず、lockfile `[[package]].source` の
# `git+<url>#<sha>` fragment を唯一の取得・検証契約として
# tools/ruviform-lock-rev.mjs が fail-closed で照合する(3 OS 共通、
# cargo 不要で lockfile のみを読む)。
[tasks.check-ruviform-lock]
description = "Cargo.lock 正本から Ruviform 全 crate の単一 resolved SHA を検証(node、3 OS 共通)"
run = "node tools/ruviform-lock-rev.mjs"

# Issue #131: ruviform ui/*(TS)lane の vendored 同期 + headless 検証。
# vendor は gitignore 済み生成物 — Cargo.lock の resolved SHA から
# tools/sync-ruviform-ui.mjs が再生成する(.worktreeinclude で継承)。
# check/test の先頭の --check は vendor が lockfile SHA と一致して
# いることの照合(未同期なら sync-ui-deps を促して失敗)。
[tasks.sync-ui-deps]
description = "ruviform ui/*(TS)を Cargo.lock と同一 SHA で ui/vendor/ へ再生成"
run = "node tools/sync-ruviform-ui.mjs"

[tasks.setup-ui]
description = "ui/ の npm devDependencies を package-lock から復元"
run = "npm ci --prefix ui --no-audit --no-fund"

[tasks.check-ui]
description = "ui/ headless GUI 統合層の型チェック(tsc --noEmit)+ vendor 同期照合"
run = [
  "node tools/sync-ruviform-ui.mjs --check",
  "npm --prefix ui run typecheck",
]

[tasks.test-ui]
description = "ui/ headless GUI 統合層の node:test スイート(happy-dom)"
run = [
  "node tools/sync-ruviform-ui.mjs --check",
  "npm --prefix ui test",
]

# Issue #105: al-gui `webview` feature lane。既定 check/lint/test は
# headless(lib + Service op 層)のまま、実窓 host 依存ターゲットは
# ここで分離検証する(ruviform-ui-webview 側の同名 task と同一形)。
[tasks.check-ui-webview]
description = "al-gui webview feature 型チェック(実窓 host ターゲット含む)"
run = "cargo check -p al-gui --features webview --all-targets"

[tasks.lint-ui-webview]
description = "al-gui webview feature lint"
run = "cargo clippy -p al-gui --all-targets --features webview -- -D warnings"

[tasks.test-ui-webview]
description = "al-gui webview feature テスト"
run = "cargo test -p al-gui --features webview"

[tasks.verify-ci]
description = "Run the CI-equivalent verification sequence: fmt -> check-ci -> lint-ci -> test-ci"
run = [
  "mise run fmt",
  "mise run check-ci",
  "mise run lint-ci",
  "mise run test-ci",
]
env = { CARGO_INCREMENTAL = "0" }

[tasks.baseline]
description = "Issue #98 pre-migration baseline の計測・収集(tools/baseline)"
run = "node tools/baseline/capture.mjs"
