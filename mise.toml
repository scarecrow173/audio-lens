[settings]
minimum_release_age = "7d"
# mise.lock と整合する固定バージョンを通常の install/use でも利用する
lockfile = true

[env]
UV_EXCLUDE_NEWER = "1 week"

# 実装言語は Rust(docs/adr/implementation-stack.md)。
# apm install / serena MCP 用の最小構成を管理する。rust toolchain は
# ここでは pin しない — 通常開発は環境導入済みの rust(rustup /
# global mise)を使い、CI 用の pin は mise.ci.toml(MISE_ENV=ci で
# 有効化)に分離する。
[tools]
# python は toolchain に含めない — pipx: バックエンドは uv 経由で uv 管理の
# cpython に venv を作るため、mise python を参照しない。直接 python を呼ぶ
# 用途ができた場合のみ追加する。
# GHSA-hq85-5cpj-mr62 (eMudhra/emSign 中間CA) の修正を含む 0.13.5 を
# exact pin する(ruviform と同一バージョン)。
# minimum_release_age = "7d" は exact version には適用されないため、
# セキュリティ修正を age gate が妨げない。
uv = "0.13.5"
# tools/cinematic-sword-cutscene (Remotion) と .agents/skills 配下の JS
# スクリプトが使う Node.js。2026-10-21 セキュリティリリースの修正版
# 26.12.1 を exact pin する(ruviform と同一バージョン。uv のコメント参照)。
# Remotion 4.x の要件 (Node.js 18+) も満たす。
node = "26.12.1"
# apm.lock.yaml は apm 0.33.0 で生成。lock 生成版に pin する。
# github バイナリバックエンドを使う(pipx 版は .mise/locks/ に dep-graph
# sidecar を要し、Python も不要になる)。
"github:microsoft/apm" = "0.33.0"
"pipx:serena-agent" = "1.7.0"
# pre-commit 互換 runner(aqua:j178/prek)。hook 定義は .pre-commit-config.yaml
# eMudhra CA 修正版 0.5.7(GHSA-hq85-5cpj-mr62 対応)。
prek = "0.5.7"
# JS/TS/JSONの軽量Lint・整形用。biome.jsonc のschema versionに合わせる（Rustには使用しない）。
# eMudhra CA 修正版 2.6.2(GHSA-hq85-5cpj-mr62 対応)。
biome = "2.6.2"
# aqua:git-lfs/git-lfs。LFS objects の materialize は setup task が担う
git-lfs = "3.8.0"
# GitHub Actions workflow の静的検証(prek hook と CI で使用。
# ruviform と同一バージョン)
actionlint = "1.7.12"

# Repository-owned setup contract: fresh checkout を開発可能にする
# canonical entrypoint。toolchain は mise.toml + mise.lock で復元される
# (rust は環境導入済みのものを使う — CI pin は mise.ci.toml/mise.ci.lock)。
[tasks.setup]
description = "Restore APM dependencies, git hooks and LFS objects for a fresh checkout"
run = [
  "apm install",
  "prek install",
  # `git lfs` は Git for Windows 同梱版が優先されるため binary 直呼びにする
  "git-lfs install --local",
  "git-lfs pull",
]

[tasks.build]
description = "Verify one Cargo package: mise run build <package> [cargo flags] (required package)"
raw_args = true
run = "cargo build --locked -p"

[tasks.test]
description = "Verify one Cargo package: mise run test <package> [cargo flags] (required package)"
raw_args = true
run = "cargo test --locked -p"

[tasks.lint]
description = "Lint one Cargo package with warnings denied: mise run lint <package> [cargo flags]"
raw_args = true
run = '''
#!/usr/bin/env bash
set -euo pipefail
if [ "$#" -lt 1 ]; then
  echo "usage: mise run lint <package> [cargo flags]" >&2
  exit 2
fi
cargo clippy --locked --all-targets -p "$@" -- -D warnings
'''

[tasks.fmt]
description = "cargo fmt --all -- --check"
run = "cargo fmt --all -- --check"

[tasks.check]
description = "Verify one Cargo package: mise run check <package> [cargo flags] (required package)"
raw_args = true
run = "cargo check --locked --all-targets -p"

# Workspace範囲(-full)と実行Profileは独立。MISE_ENV=ci の時だけ
# 既存Cargo ci Profileと CARGO_INCREMENTAL=0 を選択し、通常のローカル
# *-full はdev/test Profileを使用する。
[tasks.check-full]
description = "Workspace-wide check; dev profile locally, CI Cargo profile when MISE_ENV=ci"
run = 'cargo check --workspace --all-targets{% if env.MISE_ENV is defined and env.MISE_ENV == "ci" %} --profile ci{% endif %}'
env = { CARGO_INCREMENTAL = '{% if env.MISE_ENV is defined and env.MISE_ENV == "ci" %}0{% else %}{{ env.CARGO_INCREMENTAL | default(value="1") }}{% endif %}' }

[tasks.lint-full]
description = "Workspace-wide lint; dev profile locally, CI Cargo profile when MISE_ENV=ci"
run = [
  "biome check",
  'cargo clippy --workspace --all-targets{% if env.MISE_ENV is defined and env.MISE_ENV == "ci" %} --profile ci{% endif %} -- -D warnings',
]
env = { CARGO_INCREMENTAL = '{% if env.MISE_ENV is defined and env.MISE_ENV == "ci" %}0{% else %}{{ env.CARGO_INCREMENTAL | default(value="1") }}{% endif %}' }

[tasks.test-full]
description = "Workspace-wide test; dev profile locally, CI Cargo profile when MISE_ENV=ci"
run = 'cargo test --workspace{% if env.MISE_ENV is defined and env.MISE_ENV == "ci" %} --profile ci{% endif %}'
env = { CARGO_INCREMENTAL = '{% if env.MISE_ENV is defined and env.MISE_ENV == "ci" %}0{% else %}{{ env.CARGO_INCREMENTAL | default(value="1") }}{% endif %}' }

[tasks.build-full]
description = "Workspace-wide build; dev profile locally, CI Cargo profile when MISE_ENV=ci"
run = 'cargo build --workspace{% if env.MISE_ENV is defined and env.MISE_ENV == "ci" %} --profile ci{% endif %}'
env = { CARGO_INCREMENTAL = '{% if env.MISE_ENV is defined and env.MISE_ENV == "ci" %}0{% else %}{{ env.CARGO_INCREMENTAL | default(value="1") }}{% endif %}' }

[tasks.verify-toolchain]
description = "rustc/cargo/rustfmt/clippy が mise 解決 toolchain(CI では mise.ci.toml pin)に一致することを検証(node、3 OS 共通)"
run = "node tools/verify-toolchain.mjs"

# Issue #158: ci.yml の Full CI 構造契約(trigger・expected_sha・
# job 集合・needs・ci-summary/summary 分離・選択実行機構の不在)を
# fail-closed で検査する。prek hook 経由で hygiene job が全 run で
# 実施する(actionlint は文法、こちらは構造契約)。
[tasks.check-ci-workflow]
description = "ci.yml Full CI 構造契約の fail-closed 検査(node、CI/ローカル共通)"
run = "node tools/check-ci-workflow.mjs"

# Issue #159 (reconcile 展開): tracker 系 workflow 群の構造契約(共有
# pin 一致・reconcile 入口の trigger/guard/権限/concurrency/mode・
# event 入口の trigger 不変)を fail-closed で検査する。prek hook 経由で
# hygiene job が全 run で実施する。
[tasks.check-ci-tracker-workflows]
description = "tracker 系 workflow 構造契約の fail-closed 検査(node、CI/ローカル共通)"
run = "node tools/check-ci-tracker-workflows.mjs"

[tasks.check-cli-headless]
description = "al-cli 等 headless crate の依存木に GUI/GPU/WebView framework crate が無いことを検証(node、3 OS 共通)"
run = "node tools/check-headless-deps.mjs"

# Issue #140: Ruviform resolved revision の正本は Cargo.lock。
# manifest には rev を書かず、lockfile `[[package]].source` の
# `git+<url>#<sha>` fragment を唯一の取得・検証契約として
# tools/ruviform-lock-rev.mjs が fail-closed で照合する(3 OS 共通、
# cargo 不要で lockfile のみを読む)。
[tasks.check-ruviform-lock]
description = "Cargo.lock 正本から Ruviform 全 crate の単一 resolved SHA を検証(node、3 OS 共通)"
run = "node tools/ruviform-lock-rev.mjs"

# Issue #142: `cargo fetch --locked` 後に Ruviform Git 依存の
# resolved SHA 単一性 + manifest rev(存在時)+ ui vendor REV 整合を
# 検証する。manifest rev 有り/無し(#140 lockfile 主体)の両方式で
# 動く。vendor 必須は `node tools/check-ruviform-rev.mjs
# --require-vendor`(ui-verify lane が sync 後に使用)。
[tasks.check-ruviform-rev]
description = "Ruviform Git 依存の resolved SHA 単一性 + UI vendor REV 整合を検証(node、3 OS 共通)"
run = "node tools/check-ruviform-rev.mjs"

# Issue #131: ruviform ui/*(TS)lane の vendored 同期 + headless 検証。
# vendor は gitignore 済み生成物 — Cargo.lock の resolved SHA から
# tools/sync-ruviform-ui.mjs が再生成する(.worktreeinclude で継承)。
# check/test の先頭の --check は vendor が lockfile SHA と一致して
# いることの照合(未同期なら sync-ui-deps を促して失敗)。
[tasks.sync-ui-deps]
description = "ruviform ui/*(TS)を Cargo.lock と同一 SHA で ui/vendor/ へ再生成"
run = "node tools/sync-ruviform-ui.mjs"

[tasks.setup-ui]
description = "ui/ の npm devDependencies を package-lock から復元"
run = "npm ci --prefix ui --no-audit --no-fund"

[tasks.check-ui]
description = "ui/ headless GUI 統合層の型チェック(tsc --noEmit)+ vendor 同期照合"
run = [
  "node tools/sync-ruviform-ui.mjs --check",
  "npm --prefix ui run typecheck",
]

[tasks.test-ui]
description = "ui/ headless GUI 統合層の node:test スイート(happy-dom)"
run = [
  "node tools/sync-ruviform-ui.mjs --check",
  "npm --prefix ui test",
]

# Issue #105: al-gui `webview` feature lane。既定 check/lint/test は
# headless(lib + Service op 層)のまま、実窓 host 依存ターゲットは
# ここで分離検証する(ruviform-ui-webview 側の同名 task と同一形)。
[tasks.check-ui-webview]
description = "al-gui webview feature 型チェック(実窓 host ターゲット含む)"
run = "cargo check -p al-gui --features webview --all-targets"

[tasks.lint-ui-webview]
description = "al-gui webview feature lint"
run = "cargo clippy -p al-gui --all-targets --features webview -- -D warnings"

[tasks.test-ui-webview]
description = "al-gui webview feature テスト"
run = "cargo test -p al-gui --features webview"

# Issue #166 AL-G1: al-gui `gpui` feature lane。GPUI backend 依存は
# feature 内に閉じ込め、既定 check/lint/test は headless のまま
# 保つ(ruviform-ui-gpui 側の同名 task と同一構造)。実 OS window は
# ここでは開かない(compile/lint/headless test まで)。
[tasks.check-ui-gpui]
description = "al-gui gpui-test feature 型チェック(al-desktop・GpuiObserver parity test 含む)"
run = "cargo check -p al-gui --features gpui-test --all-targets"

[tasks.lint-ui-gpui]
description = "al-gui gpui-test feature lint"
run = "cargo clippy -p al-gui --all-targets --features gpui-test -- -D warnings"

[tasks.test-ui-gpui]
description = "al-gui gpui-test feature テスト(headless: GpuiObserver seam による Fake/GPUI parity)"
run = "cargo test -p al-gui --features gpui-test"

# Issue #206 AL-CI-L1-01: `al-desktop` bin(required-features =
# gpui)の Native Build/Link 検証。production feature `gpui`
# のみで build し、gpui-test の test-support 経路とは分離する。
[tasks.build-ui-gpui]
description = "al-desktop bin (gpui feature) の Native Build/Link 検証"
run = "cargo build -p al-gui --features gpui --bin al-desktop"

[tasks.verify-full]
description = "Workspace standard full verification: fmt, check-full, lint-full, test-full (profile selected by MISE_ENV)"
run = [
  "mise run fmt",
  "mise run check-full",
  "mise run lint-full",
  "mise run test-full",
]

[tasks.baseline]
description = "Issue #98 pre-migration baseline の計測・収集(tools/baseline)"
run = "node tools/baseline/capture.mjs"
